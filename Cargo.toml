[workspace]
members = ["satz-core", "satz-cli", "satz-lsp"]
resolver = "2"

[workspace.package]
version = "0.1.34"
edition = "2024"
# let-chains (`if let .. && ..`, used throughout) are stable from 1.88 in edition 2024.
rust-version = "1.88"
authors = ["hardhus"]
license-file = "LICENSE"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
notify = "8.2"
nucleo-matcher = "0.3"
petgraph = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1.12"
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.1"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }
toml = "1.1"
tower-lsp-server = "0.23.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
unicode-width = "0.2"

satz-core = { path = "satz-core" }
similar = "3.2"

# test
insta = "1.48"
