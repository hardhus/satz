[workspace]
members = ["satz-core", "satz-cli", "satz-lsp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["hardhus"]
license-file = "LICENSE"
publish = false

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
notify = "8.2"
nucleo-matcher = "0.3"
petgraph = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1.12"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.1"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"
tower-lsp-server = "0.23.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

satz-core = { path = "satz-core" }
similar = "2.7"

# test
insta = "1.48"
